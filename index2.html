<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>নদীপাড়ার খবর</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@500;700;800&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfaf7;--card:#fff;--ink:#1c1f23;--mute:#5d646c;--line:#dcd9d0;--accent:#0e6b5c;--hot:#c2410c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1c2024;--ink:#eceae4;--mute:#a1a8af;--line:#33383d;--accent:#3fbfa8;--hot:#fb923c}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1c2024;--ink:#eceae4;--mute:#a1a8af;--line:#33383d;--accent:#3fbfa8;--hot:#fb923c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Noto Sans Bengali",sans-serif}
a{color:inherit;text-decoration:none}a:hover h2,a:hover h3,a:hover h4{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.w{max-width:1160px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);padding:8px 0;border-bottom:1px solid var(--line)}
.top button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:2px 12px;cursor:pointer;font:inherit}
.brand{text-align:center;padding:18px 0 10px}
.brand b{font:800 clamp(32px,6vw,52px)/1.2 "Noto Serif Bengali",serif;color:var(--accent)}
.brand small{display:block;color:var(--mute);font-size:13px}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-top:2px solid var(--ink);border-bottom:1px solid var(--line);z-index:5}
nav .w{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav a{padding:10px 14px;white-space:nowrap;font-weight:600;font-size:15px}
nav a.on,nav a:hover{color:var(--accent);box-shadow:inset 0 -3px var(--accent)}
.tick{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;overflow:hidden}
.tick strong{background:var(--hot);color:#fff;padding:1px 10px;border-radius:3px;flex:none}
.tick span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:28px;padding:22px 0}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.pic{display:block;width:100%;aspect-ratio:16/9;border-radius:4px;background:linear-gradient(135deg,var(--c1,#0e6b5c),var(--c2,#d9a441))}
.lead h2{font:800 clamp(26px,4vw,38px)/1.35 "Noto Serif Bengali",serif;margin:12px 0 6px}
.lead p{color:var(--mute);margin:0}
.tag{color:var(--hot);font-weight:600;font-size:14px}
.sub{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
@media(max-width:600px){.sub{grid-template-columns:1fr}}
h3{font:700 18px/1.5 "Noto Serif Bengali",serif;margin:8px 0 0}
aside{border-left:1px solid var(--line);padding-left:24px}
@media(max-width:820px){aside{border:0;padding:0}}
aside h4.hd,.sec h4.hd{font:800 20px "Noto Serif Bengali",serif;margin:0 0 10px;padding-bottom:6px;border-bottom:3px solid var(--accent)}
.list a{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .t{color:var(--mute);font-size:13px;flex:none;width:52px}
.list h4{margin:0;font:600 16px/1.5 "Noto Sans Bengali"}
.pop a{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.pop i{font:800 28px/1 "Noto Serif Bengali",serif;color:var(--accent);font-style:normal;flex:none;width:30px}
.pop h4{margin:0;font:600 16px/1.5 "Noto Sans Bengali"}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding:10px 0 30px;border-top:2px solid var(--ink)}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.sec a{display:block;padding:10px 0;border-bottom:1px solid var(--line)}
.sec .pic{aspect-ratio:3/2;margin-bottom:6px}
footer{background:var(--card);border-top:1px solid var(--line);padding:24px 0;color:var(--mute);font-size:14px;text-align:center}
.hide{display:none}
</style>
</head>
<body>
<div class="w">
  <div class="top"><span id="date"></span><button id="th" type="button">রাত/দিন মোড</button></div>
  <div class="brand"><b>নদীপাড়ার খবর</b><small>সত্য, স্পষ্ট, সবার জন্য</small></div>
</div>
<nav><div class="w" id="nav"></div></nav>
<div class="w">
  <div class="tick"><strong>শিরোনাম</strong><span id="tk"></span></div>
  <div class="grid">
    <main>
      <div id="hero"></div>
      <div class="sub" id="sub"></div>
    </main>
    <aside>
      <h4 class="hd">সর্বশেষ</h4>
      <div class="list" id="latest"></div>
      <h4 class="hd" style="margin-top:26px">সবচেয়ে পঠিত</h4>
      <div class="pop" id="pop"></div>
    </aside>
  </div>
  <div class="cols" id="cols"></div>
</div>
<footer><div class="w">© ২০২৬ নদীপাড়ার খবর। এটি একটি নমুনা ওয়েবসাইট; সব লেখা কাল্পনিক।</div></footer>
<script>
const cats=["প্রচ্ছদ","বাংলাদেশ","রাজনীতি","অর্থনীতি","খেলা","বিশ্ব","বিনোদন","প্রযুক্তি","মতামত"];
const A=[
{c:"অর্থনীতি",h:"নতুন বাজেটে কৃষকদের জন্য সহজ ঋণের ঘোষণা, উপকৃত হবেন লাখো পরিবার",d:"গ্রামীণ অর্থনীতি চাঙ্গা করতে সরকার ঋণের শর্ত শিথিল করার পরিকল্পনা নিয়েছে।",a:"#0e6b5c",b:"#d9a441"},
{c:"বাংলাদেশ",h:"খুলনায় নদীভাঙন রোধে নতুন প্রকল্প শুরু",d:"",a:"#1d4e89",b:"#79b4d8"},
{c:"খেলা",h:"ঘরের মাঠে রোমাঞ্চকর জয়, সিরিজে এগিয়ে বাংলাদেশ",d:"",a:"#b45309",b:"#f2c14e"},
{c:"প্রযুক্তি",h:"স্কুলে শিশুদের কোডিং শেখানোর উদ্যোগ ছড়াচ্ছে জেলায় জেলায়",d:"",a:"#5b3a8c",b:"#c3a6e6"},
{c:"বিশ্ব",h:"জলবায়ু সম্মেলনে উপকূলীয় দেশগুলোর যৌথ তহবিলের দাবি",d:"",a:"#14532d",b:"#86c98f"},
{c:"বিনোদন",h:"বইমেলায় এবার নতুন লেখকদের ভিড়",d:"",a:"#9f1239",b:"#f4a3b5"},
{c:"রাজনীতি",h:"সংসদে আলোচনায় স্থানীয় সরকার আইনের সংশোধনী",d:"",a:"#334155",b:"#94a3b8"},
{c:"মতামত",h:"শহরের নদী বাঁচাতে নাগরিকদের ভূমিকা কতটা জরুরি",d:"",a:"#7c2d12",b:"#e9a97a"},
{c:"অর্থনীতি",h:"রপ্তানি আয় বেড়েছে, তবে চ্যালেঞ্জ রয়ে গেছে জ্বালানি খরচে",d:"",a:"#065f46",b:"#a7d8c4"},
{c:"খেলা",h:"নারী ক্রিকেট দলের নতুন অধিনায়কের প্রথম সাক্ষাৎকার",d:"",a:"#92400e",b:"#fbbf77"},
{c:"প্রযুক্তি",h:"গ্রামে ইন্টারনেটের গতি বাড়াতে নতুন টাওয়ার বসছে",d:"",a:"#4338ca",b:"#a5b4fc"},
{c:"বাংলাদেশ",h:"শীতের শুরুতে রাজধানীতে বাড়ছে বায়ুদূষণ, সতর্কতা জারি",d:"",a:"#475569",b:"#cbd5e1"}
];
const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const pic=x=>`<span class="pic" style="--c1:${x.a};--c2:${x.b}"></span>`;
document.getElementById("date").textContent=new Date().toLocaleDateString("bn-BD",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
document.getElementById("nav").innerHTML=cats.map((c,i)=>`<a href="#${i?'c'+i:'top'}" class="${i?'':'on'}">${c}</a>`).join("");
document.getElementById("tk").textContent=A.slice(0,4).map(x=>x.h).join("  •  ");
const L=A[0];
document.getElementById("hero").innerHTML=`<a class="lead" href="#"><article>${pic(L)}<div class="tag" style="margin-top:10px">${L.c}</div><h2>${L.h}</h2><p>${L.d}</p></article></a>`;
document.getElementById("sub").innerHTML=A.slice(1,4).map(x=>`<a href="#">${pic(x)}<div class="tag" style="margin-top:6px">${x.c}</div><h3>${x.h}</h3></a>`).join("");
document.getElementById("latest").innerHTML=A.slice(4,10).map((x,i)=>`<a href="#"><span class="t">${bn(i*12+5)} মিনিট আগে</span><h4>${x.h}</h4></a>`).join("");
document.getElementById("pop").innerHTML=A.slice(6,11).map((x,i)=>`<a href="#"><i>${bn(i+1)}</i><h4>${x.h}</h4></a>`).join("");
const secs=[["খেলা",4],["অর্থনীতি",5],["প্রযুক্তি",6]];
document.getElementById("cols").innerHTML=[["বাংলাদেশ",[1,11]],["খেলা",[2,9]],["বিশ্ব",[4,7]]].map(([n,ix],k)=>`<section class="sec" id="c${k+1}"><h4 class="hd">${n}</h4><a href="#">${pic(A[ix[0]])}<h3>${A[ix[0]].h}</h3></a><a href="#"><h4 style="margin:0;font:600 16px/1.5 'Noto Sans Bengali'">${A[ix[1]].h}</h4></a></section>`).join("");
const r=document.documentElement;
document.getElementById("th").onclick=()=>{const d=(r.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))==="dark";r.dataset.theme=d?"light":"dark"};
</script>
</body>
</html>
